name: PLUG ART V22 Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  v22:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: V22 syntax
        run: |
          python -m py_compile app_extra_v22.py rebuild_plugy_rigready.py
          node --check static/studio_v22.js
      - name: V22 exact rig-ready rebuild and tests
        env:
          PLUGART_DB: /tmp/plugart_v22_ci.db
          PLUGART_AUTORADAR: '0'
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_v22.py
          python - <<'PY'
          import app_extra_v22 as v22
          import hashlib
          raw=v22.GLB.read_bytes()
          assert raw[:4] == b'glTF'
          assert len(raw) == 414024
          assert hashlib.sha256(raw).hexdigest() == '834a9621418173173d391c33dc1c5785138a05fcacf43606f0a358a428be9a37'
          print('PLUGY V2 rig-ready exact OK', len(raw))
          PY
      - name: V22 UI markers
        run: |
          grep -q 'single-screen-creator' app_extra_v22.py
          grep -q 'rebuild_plugy_rigready' app_extra_v22.py
          grep -q 'TARGET_SHA256' rebuild_plugy_rigready.py
          grep -q 'Créer une publication' static/studio_v22.js
          grep -q 'Éditeur avancé' static/studio_v22.js
          grep -q 'plug-studio-v22-active' static/studio_v22.css
