name: PLUG ART Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Backend syntax
        run: python -m py_compile app.py
      - name: Backend tests
        env:
          PLUGART_DB: /tmp/plugart_ci.db
          PLUGART_AUTORADAR: '0'
        run: pytest -q
      - name: Frontend integrity
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          html=Path('static/index.html').read_text(encoding='utf-8')
          required=['explorer','opencalls','events','artists','resources','workspace','oppGrid','eventGrid','artistGrid','world','candidateGrid','desktopMsgs','floatMsgs']
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if 'id' in d:self.ids.append(d['id'])
          p=P();p.feed(html)
          missing=[x for x in required if x not in p.ids]
          dup=[x for x in set(p.ids) if p.ids.count(x)>1]
          assert not missing, f'Missing ids: {missing}'
          assert not dup, f'Duplicate ids: {dup}'
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S)
          assert scripts, 'No inline JavaScript found'
          Path('/tmp/plugart-frontend.js').write_text('\n'.join(scripts),encoding='utf-8')
          print(f'HTML OK: {len(p.ids)} ids, {len(html)} chars')
          PY
          node --check /tmp/plugart-frontend.js
