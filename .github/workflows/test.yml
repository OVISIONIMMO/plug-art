name: PLUG ART Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Backend syntax
        run: python -m py_compile app.py app_extra.py app_extra_v10.py app_extra_v11.py app_extra_v12.py app_extra_v14.py app_extra_v15.py app_extra_v16.py app_extra_v17.py app_extra_v19.py app_extra_v20.py app_extra_v21.py build_plugy_glb.py
      - name: Backend tests
        env:
          PLUGART_DB: /tmp/plugart_ci.db
          PLUGART_AUTORADAR: '0'
        run: pytest -q
      - name: Frontend integrity
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          parts=sorted(Path('static').glob('v8_part_*.html'))
          html=''.join(p.read_text(encoding='utf-8') for p in parts) if parts else Path('static/index.html').read_text(encoding='utf-8')
          Path('/tmp/plugart-v8.html').write_text(html,encoding='utf-8')
          required=['explorer','opencalls','events','artists','mapview','resources','workspace','content','notes','contacts','oppGrid','eventGrid','artistGrid','world','radarMap','candidateGrid','detailModal','modalSource','desktopMsgs','floatMsgs']
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if 'id' in d:self.ids.append(d['id'])
          p=P();p.feed(html)
          missing=[x for x in required if x not in p.ids]
          dup=[x for x in set(p.ids) if p.ids.count(x)>1]
          assert not missing, f'Missing ids: {missing}'
          assert not dup, f'Duplicate ids: {dup}'
          assert 'PLUGY, mascotte PLUG ART 3D réaliste à tête de prise' in html
          assert '/api/opportunities/${item.id}/thumbnail' in html
          assert 'basemaps.cartocdn.com' in html
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,re.S)
          assert scripts, 'No inline JavaScript found'
          Path('/tmp/plugart-frontend.js').write_text('\n'.join(scripts),encoding='utf-8')
          print(f'Base HTML OK: {len(p.ids)} ids, {len(html)} chars, {len(parts)} parts')
          PY
          node --check /tmp/plugart-frontend.js
          node --check static/content_studio_v10.js
          node --check static/content_studio_v11.js
          node --check static/thumbnail_v16.js
          node --check static/studio_v17.js
          node --check static/studio_v20.js
          node --check static/plugy_glb_runtime_v20.js
          node --check static/studio_v21.js
      - name: V11 assets
        run: |
          test -s static/content_studio_v11.css
          test -s static/content_studio_v11.js
          grep -q "Photo IA PLUGY" static/content_studio_v11.js
          grep -q "plugart_templates_v11" static/content_studio_v11.js
          grep -q "gpt-image-2.5-sunburst" app_extra_v11.py
      - name: Legacy glass assets
        run: |
          test -s static/glass_v12.css
          test -s static/glass_v14.css
          grep -q -- '--glass-bg' static/glass_v12.css
          grep -q -- '--v14-bubble' static/glass_v14.css
      - name: V15 maximum transparent bubble theme
        run: |
          test -s static/glass_v15.css
          grep -q -- '--v15-glass' static/glass_v15.css
          grep -q 'body:before' static/glass_v15.css
          grep -q 'filter:blur(22px)' static/glass_v15.css
          grep -q 'backdrop-filter:blur(34px)' static/glass_v15.css
          grep -q 'version = "15.0"' app_extra_v15.py
          grep -q 'glass_v15.css?v=15.20260909.1' app_extra_v15.py
          grep -q 'maximum-transparent-bubble' app_extra_v15.py
      - name: V16 contrast and thumbnails
        run: |
          test -s static/visual_v16.css
          test -s static/thumbnail_v16.js
          grep -q -- '--v16-text' static/visual_v16.css
          grep -q 'thumb-placeholder-v16' static/visual_v16.css
          grep -q 'detail-dialog' static/visual_v16.css
          grep -q 'resolveThumb = function' static/thumbnail_v16.js
          grep -q 'thumbHTML = function' static/thumbnail_v16.js
          grep -q 'app.version = "16.2"' app_extra_v16.py
          grep -q 'thumbnail_proxy_v16' app_extra_v16.py
          grep -q 'visual_v16.css?v=16.20260909.1' app_extra_v16.py
          grep -q 'thumbnail_v16.js?v=16.20260909.1' app_extra_v16.py
      - name: Exact PLUGY GLB source
        run: |
          test "$(find assets -maxdepth 1 -name 'plugy_web_mascot_part_*.b64' | wc -l)" -eq 8
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          parts=sorted(Path('assets').glob('plugy_web_mascot_part_*.b64'))
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw=lzma.decompress(base64.b64decode(encoded))
          assert len(raw)==411480, len(raw)
          assert hashlib.sha256(raw).hexdigest()=='f8438dea4931c3324854575b9ce97c7cb2747e5ae5eaa1bc34941aa219ac0f70'
          assert raw[:4]==b'glTF'
          print('PLUGY GLB exact OK:', len(raw), hashlib.sha256(raw).hexdigest())
          PY
      - name: V17 compatibility layer
        run: |
          test -s static/studio_v17.css
          test -s static/studio_v17.js
          test -s app_extra_v17.py
          grep -q 'app.version = "17.0"' app_extra_v17.py
          grep -q 'MODEL_PARTS' app_extra_v17.py
      - name: V20 current production baseline
        run: |
          test -s static/studio_v20.css
          test -s static/studio_v20.js
          test -s static/plugy_v20.css
          test -s static/plugy_glb_runtime_v20.js
          grep -q 'app.version = "20.1"' app_extra_v20.py
          grep -q 'build_plugy_glb' app_extra_v20.py
      - name: V21 guided studio and new PLUGY
        run: |
          test -s static/studio_v21.css
          test -s static/studio_v21.js
          test -s app_extra_v21.py
          grep -q 'app.version = "21.0"' app_extra_v21.py
          grep -q 'MODEL_SHA256 = "f8438dea4931c3324854575b9ce97c7cb2747e5ae5eaa1bc34941aa219ac0f70"' app_extra_v21.py
          grep -q 'guided-three-step-workflow' app_extra_v21.py
          grep -q 'plug-v21-progress' static/studio_v21.css
          grep -q 'plug-v21-advanced' static/studio_v21.css
          grep -q 'Construire le sujet' static/studio_v21.js
          grep -q 'reorganizeAdvanced' static/studio_v21.js
