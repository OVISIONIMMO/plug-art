name: PLUG ART Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Tests
        env:
          PLUGART_DB: /tmp/plugart_ci.db
          PLUGART_AUTORADAR: '0'
        run: pytest -q
