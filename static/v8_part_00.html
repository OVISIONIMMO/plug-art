<style>

.head-actions{display:flex;align-items:center;gap:14px}.space-btn,.primary,.soft,.ghost,.tiny{border-radius:999px;font-weight:750}.space-btn{border:0;background:var(--ink);color:#fff;padding:15px 26px}.mini-orb{width:40px;height:40px;border-radius:50%;background:conic-gradient(#ff4ebc,#6b4cff,#32d6ef,#ff9a45,#ff4ebc);box-shadow:inset 0 0 14px #fff9,0 8px 28px #744cff30}.menu{width:42px;height:42px;border:0;background:none;font-size:24px}

.art-wrap{position:relative;min-height:580px;display:grid;place-items:center}.art-glow{position:absolute;width:84%;height:72%;border-radius:50%;background:radial-gradient(circle,#6d56ff36,#38d8ee1e 42%,transparent 68%);filter:blur(10px)}.art-floor{position:absolute;bottom:38px;width:54%;height:38px;border-radius:50%;background:radial-gradient(circle,#7a70ff44 0,#7a70ff10 44%,transparent 72%);filter:blur(18px)}
.mascot{width:100%;max-width:720px;filter:drop-shadow(0 32px 44px rgba(93,93,200,.23));animation:float 6s ease-in-out infinite}.orbit{animation:spin 22s linear infinite;transform-origin:350px 270px}.float1{animation:float2 4.8s ease-in-out infinite}.float2{animation:float2 5.5s ease-in-out -1s infinite}.tilt{animation:tilt 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px) rotate(.6deg)}}@keyframes float2{50%{transform:translateY(-8px)}}@keyframes tilt{50%{transform:translateY(-6px) rotate(-2deg)}}@keyframes spin{to{transform:rotate(360deg)}}
.plugy-panel,.glass{background:linear-gradient(145deg,rgba(239,244,255,.94),rgba(255,255,255,.86));border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}

.plugy-head{display:flex;align-items:center;gap:10px;position:relative;z-index:1}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#d7f5ff,#7460ff);display:grid;place-items:center;font-weight:900;color:#fff;box-shadow:0 10px 24px rgba(87,92,224,.24)}.status{font-size:10px;color:#12aa6b}.tools{margin-left:auto;color:#69738c;font-size:19px}.intro{background:#ffffffcf;border-radius:20px;padding:15px;font-size:12px;line-height:1.6;margin:12px 0;position:relative;z-index:1}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:11px;color:#30405f}.stream{flex:1;overflow:auto;min-height:0;margin-top:9px;padding-right:3px}.msg{font-size:12px;line-height:1.48;padding:10px 12px;border-radius:16px;margin:8px 0;box-shadow:0 6px 18px rgba(42,54,91,.06)}.msg.user{background:#0b1427;color:#fff;margin-left:36px}.msg.bot{background:#fff;margin-right:14px}.msg.sys{background:#f2f5ff;color:#4e5c7a;border:1px solid rgba(83,93,150,.1)}.chat-form{display:grid;grid-template-columns:1fr auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:8px 8px 8px 14px;gap:8px}.chat-form textarea{min-height:52px;max-height:110px;resize:vertical;border:0;outline:0;background:none;font-size:12px}.chat-form button{width:42px;height:42px;border:0;border-radius:50%;background:var(--ink);color:#fff;align-self:end}.comm-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 12px;position:relative;z-index:1}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.artist-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.resource-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}

.opp-card,.candidate,.event,.artist,.resource,.note-card,.contact-card{position:relative;overflow:hidden}.opp-card:before,.candidate:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--violet),var(--pink))}.topline{display:flex;justify-content:space-between;gap:8px;margin:4px 0 14px}.kicker{font-size:9px;letter-spacing:1.8px;color:#68759a;text-transform:uppercase}.score{font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px;color:#5141d8;background:#f0efff}.opp-card h3,.candidate h3,.event h3,.artist h3,.resource h3,.detail-head h2{font-size:20px;line-height:1.14;margin:0 0 8px}.opp-card p,.candidate p,.event p,.artist p,.resource p,.detail-copy,.contact-card p,.note-card p{color:#73809a;font-size:12px;line-height:1.58}.thumb{height:168px;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#eef1ff,#ffffff);display:grid;place-items:center;margin-bottom:14px;position:relative}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb .fallback{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(1.05)}.thumb-badge{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.92);padding:7px 10px;border-radius:999px;font-size:10px;font-weight:800;color:#2b3a58;box-shadow:0 8px 18px rgba(61,72,100,.11)}

.artist{display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:center}.portrait{height:150px;border-radius:18px;background:linear-gradient(145deg,#4165ff,#3ad5ee,#ef4db7);background-size:cover;background-position:center}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:9px;background:#f0efff;color:#4e42d3;border-radius:999px;padding:5px 8px}.ricon{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#e8efff,#d8f8ff);display:grid;place-items:center;font-size:22px;margin-bottom:42px}

.list{display:grid;gap:12px}.note-card,.contact-card{padding:16px}.mini-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
